<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopfschmerz-Tagebuch</title>
</head>

<body>

<h1>Kopfschmerz-Tagebuch</h1>

<label>Datum:</label>
<input type="date">

<br><br>

<label>Kopfschmerzstärke 0–10:</label>
<input type="number" min="0" max="10">

<br><br>

<label>Dauer in Stunden:</label>
<input type="number" step="0.5">

<br><br>

<button>Speichern</button>

</body>
</html>
